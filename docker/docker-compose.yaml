name: beauty_helper_fastapi

services:
  # === PostgreSQL ===
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: bh_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # === Redis ===
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: bh_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # === RabbitMQ ===
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    container_name: bh_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP протокол
      - "15672:15672"  # Management UI
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # === Celery Worker ===
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: bh_celery
    command: celery -A infrastructure.celery.app worker --loglevel=info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bh_network

  # === Celery Beat ===
  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: bh_celery_beat
    command: celery -A infrastructure.celery.app beat --loglevel=info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bh_network

  # === FastAPI-приложение ===
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: bh_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
        - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bh_network

volumes:
  postgres_data:


networks:
  bh_network:
    driver: bridge
