name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Postgres для миграций и интеграционных тестов. Логин, пароль и имя БД
    # совпадают с .env.example, который копируется в .env ниже.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_post
          POSTGRES_DB: beauty_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # В .env.example хост db (имя сервиса docker-compose), а в CI Postgres
    # доступен на localhost. Переменная окружения важнее значения из .env.
    env:
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare .env
        # Тестам нужен .env, чтобы инициализировался core.config.Settings.
        # Значения-плейсхолдеры из шаблона: unit-тесты к внешним сервисам не ходят.
        run: cp .env.example .env

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Migrations on clean database
        run: alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Tests
        run: pytest -q
