name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare .env
        # Тестам нужен .env, чтобы инициализировался core.config.Settings.
        # Значения-плейсхолдеры из шаблона: unit-тесты к внешним сервисам не ходят.
        run: cp .env.example .env

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q
